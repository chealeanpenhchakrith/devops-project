apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base: what every environment shares (workload shape, service, probes, resources).
# Environment-specific values live in overlays/<env>/kustomization.yaml.
resources:
  - deployment.yaml
  - service.yaml

generatorOptions:
  # Stable object names: envFrom -> configMapRef/secretRef in the Deployment only
  # works with predictable names, and `kubectl get cm` stays readable.
  disableNameSuffixHash: true

configMapGenerator:
  - name: myapp-config
    literals:
      - APP_ENV=dev
      - PORT=3000

# Demo only: this is a fake value. A real deployment reads secrets from a secret
# manager (External Secrets, Sealed Secrets, Vault) and never from Git.
secretGenerator:
  - name: myapp-secret
    literals:
      - API_KEY=changeme
