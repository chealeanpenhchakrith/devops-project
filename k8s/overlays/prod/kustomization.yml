apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

replicas:
  - name: myapp
    count: 5

labels:
  - pairs:
      env: prod
    includeTemplates: true

configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
