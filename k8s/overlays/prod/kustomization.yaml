apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment: cloud B, 5 replicas, pinned to a known-good tag.
namespace: prod

resources:
  - ../../base

labels:
  - pairs:
      env: prod
      cloud: cloud-b
    includeSelectors: true

replicas:
  - name: myapp
    count: 5

images:
  - name: ghcr.io/chealeanpenhchakrith/devops-project
    newTag: "4b4ba17256b5a6f5f31c86f77a1e514d7b485266"

configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
