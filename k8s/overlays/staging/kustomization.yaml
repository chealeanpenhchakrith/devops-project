apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging environment: cloud A, 2 replicas, same release as production.
namespace: staging

resources:
  - ../../base

labels:
  - pairs:
      env: staging
      cloud: cloud-a
    includeSelectors: true

replicas:
  - name: myapp
    count: 2

images:
  - name: ghcr.io/chealeanpenhchakrith/devops-project
    newTag: "92423135c07f8fd5366a49a31ffa7824b7de07a9"

# Keep the traceability annotation in sync with the image this overlay deploys
patches:
  - target:
      kind: Deployment
      name: myapp
    patch: |-
      - op: replace
        path: /metadata/annotations/git-commit
        value: 92423135c07f8fd5366a49a31ffa7824b7de07a9

configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_ENV=staging
